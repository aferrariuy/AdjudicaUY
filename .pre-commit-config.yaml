repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-requests
          - sqlalchemy
          - fastapi
          - httpx
          - lxml
          - pydantic-settings
          - schedule
          - pytz
          - jinja2
          - alembic
          - psycopg2-binary
