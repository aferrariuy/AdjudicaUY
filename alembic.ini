# A generic, single-database Alembic configuration.
#
# The database URL is intentionally left blank here: it is resolved at
# runtime from the application's Settings (see migrations/env.py). This keeps
# secrets out of source control and gives the scraper worker and the web app
# the same connection string.

[alembic]
script_location = migrations
prepend_sys_path = .

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max identifier length enforced by the database
truncate_slug_length = 40

# Allow .pyc files to be ignored
sourceless = false

# Version path separator (default is os.pathsep)
version_path_separator = os

# sqlalchemy.url is intentionally empty — env.py reads it from Settings.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
