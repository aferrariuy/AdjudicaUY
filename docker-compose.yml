# AdjudicaUY — Docker Compose stack
#
# All three services are defined here:
#   * app    — FastAPI + uvicorn, port 8000
#   * worker — scraper scheduler (long-running, executes scrape daily)
#   * db     — PostgreSQL 16
#
# Environment variables are loaded from the .env file in the same directory.
# For Dokploy: mount or copy the .env file to the server.
#
# The worker runs a persistent scheduler that executes the scraper once
# daily at SCRAPE_HOUR:SCRAPE_MINUTE UTC (default 02:00 = 23:00 Montevideo).
# Override the schedule via Dokploy environment variables.

services:
  db:
    image: postgres:16-alpine
    container_name: adjudicauy-db-v2
    restart: unless-stopped
    # PostgreSQL parallel-query workers allocate dynamic shared memory (DSM)
    # backed by /dev/shm, which Docker caps at 64 MB by default. The
    # company-identity window query spawns parallel workers that exhaust that
    # budget and fail with "could not resize shared memory segment ... No
    # space left on device". Give the DB a larger shm mount.
    shm_size: 256m
    networks:
      # The database lives only on the internal Compose network. It is
      # NOT attached to the external Dokploy network; that prevents any
      # other tenant container on the shared host from reaching Postgres.
      - default
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - adjudicauy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-app:latest
    container_name: adjudicauy-app
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    healthcheck:
      # Lightweight /healthz endpoint — avoids rendering templates and
      # exposing the homepage to the shared Dokploy network.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-worker:latest
    container_name: adjudicauy-worker
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-2}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
      WORKER_HEARTBEAT_FILE: ${WORKER_HEARTBEAT_FILE:-/tmp/worker.heartbeat}
      WORKER_LAST_RUN_FILE: ${WORKER_LAST_RUN_FILE:-/tmp/worker.last-run.json}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from scraper.scheduler import _heartbeat_is_fresh; raise SystemExit(0 if _heartbeat_is_fresh(os.environ['WORKER_HEARTBEAT_FILE'], 300) else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Long-running scheduler — runs the scraper once daily at the
    # configured time. Dokploy needs a running container for its
    # Scheduled Jobs feature (docker exec).
    command: ["python", "-m", "scraper.scheduler"]

volumes:
  adjudicauy-db-data:

networks:
  dokploy-network:
    external: true
