# AdjudicaUY — Docker Compose stack
#
# All three services are defined here:
#   * app    — FastAPI + uvicorn, port 8000
#   * worker — scraper scheduler (long-running, executes scrape daily)
#   * db     — PostgreSQL 16
#
# Environment variables are loaded from the .env file in the same directory.
# For Dokploy: mount or copy the .env file to the server.
#
# The worker runs a persistent scheduler that executes the scraper once
# daily at SCRAPE_HOUR:SCRAPE_MINUTE UTC (default 02:00 = 23:00 Montevideo).
# Override the schedule via Dokploy environment variables.

services:
  db:
    image: postgres:16-alpine
    container_name: adjudicauy-db-v2
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - adjudicauy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-app:latest
    container_name: adjudicauy-app
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
    healthcheck:
      # Hit the homepage to confirm uvicorn is up and Jinja2 templates load.
      # ``urlopen`` raises on 4xx/5xx and on connection errors, which makes
      # the healthcheck fail loudly when the service is broken.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-worker:latest
    container_name: adjudicauy-worker
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-2}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
    # Long-running scheduler — runs the scraper once daily at the
    # configured time. Dokploy needs a running container for its
    # Scheduled Jobs feature (docker exec).
    command: ["python", "-m", "scraper.scheduler"]

volumes:
  adjudicauy-db-data:

networks:
  dokploy-network:
    external: true
