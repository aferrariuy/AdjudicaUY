# AdjudicaUY — Docker Compose stack
#
# All three services are defined here:
#   * app    — FastAPI + uvicorn, port 8000
#   * worker — scraper (one-shot, triggered by Dokploy's Scheduled Job)
#   * db     — PostgreSQL 16
#
# Environment variables are loaded from the .env file in the same directory.
# For Dokploy: mount or copy the .env file to the server.
#
# Scheduled Job configuration (set in Dokploy UI):
#   * Service:  worker
#   * Schedule: 0 2 * * *   (02:00 UTC = 23:00 Montevideo)
#   * Command:  python -m scraper.main

services:
  db:
    image: postgres:16-alpine
    container_name: adjudicauy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-adjudicauy}
    volumes:
      - pgdata3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-app:latest
    container_name: adjudicauy-app
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adjudicauy}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
    healthcheck:
      # Hit the homepage to confirm uvicorn is up and Jinja2 templates load.
      # ``urlopen`` raises on 4xx/5xx and on connection errors, which makes
      # the healthcheck fail loudly when the service is broken.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: adjudicauy-worker:latest
    container_name: adjudicauy-worker
    # The worker is a one-shot job. Dokploy's Scheduled Job creates a fresh
    # container per run; ``restart: no`` avoids a tight loop if the scrape
    # crashes.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adjudicauy}
      SOURCE_A_BASE_URL: ${SOURCE_A_BASE_URL}
      SOURCE_B_BASE_URL: ${SOURCE_B_BASE_URL}
      BCU_API_URL: ${BCU_API_URL}
    # Override the Dockerfile's default CMD with the scraper entry point.
    command: ["python", "-m", "scraper.main"]

volumes:
  pgdata3:

networks:
  dokploy-network:
    external: true
