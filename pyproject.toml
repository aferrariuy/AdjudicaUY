[project]
name = "adjudica-uy"
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8, black, isort, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["B008"]   # Depends() in FastAPI route defaults is the standard pattern
"scraper/**" = ["S320"]  # lxml parsing is the core scraper functionality
"tests/**" = ["S101"]  # allow assert in tests
"tests/scraper/test_rss_feed.py" = ["E501"]  # XML test data strings are inherently long
"tests/scraper/test_xml_report.py" = ["E501"]  # XML test data strings are inherently long

# ---------------------------------------------------------------------------
# mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["app", "scraper", "tests"]
exclude = ["migrations/", ".venv/"]


