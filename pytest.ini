[pytest]
# Pytest configuration for the AdjudicaUY test suite.
#
# We keep this minimal — the heavy lifting lives in ``tests/conftest.py``.
# The settings below make `pytest` Just Work for the test layer the
# ``sdd-apply`` executor added in PR 4.

# Add the project root to sys.path so the test files can import
# ``app.*`` and ``scraper.*`` without needing an editable install.
pythonpath = .

testpaths = tests

# Markers the test suite may grow into. Declared here so the markers
# are recognised even when no test yet uses them.
markers =
    slow: end-to-end / smoke tests that exercise the full pipeline.
    integration: tests that touch the database OR the HTTP layer.
